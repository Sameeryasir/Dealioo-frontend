services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-ap2}
        NEXT_PUBLIC_DO_SPACES_CDN_URL: ${NEXT_PUBLIC_DO_SPACES_CDN_URL:-}
        NEXT_PUBLIC_RP_META_PIXEL_ID: ${NEXT_PUBLIC_RP_META_PIXEL_ID:-}
        BACKEND_URL: ${BACKEND_URL:-${NEXT_PUBLIC_API_URL}}
    ports:
      - "${PORT:-3002}:3002"
    environment:
      PORT: 3002
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      BACKEND_URL: ${BACKEND_URL:-${NEXT_PUBLIC_API_URL}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-ap2}
      NEXT_PUBLIC_DO_SPACES_CDN_URL: ${NEXT_PUBLIC_DO_SPACES_CDN_URL:-}
      NEXT_PUBLIC_RP_META_PIXEL_ID: ${NEXT_PUBLIC_RP_META_PIXEL_ID:-}
    env_file:
      - .env
    restart: unless-stopped
