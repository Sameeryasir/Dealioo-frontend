name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is empty"
            exit 1
          fi

          if echo "$SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "SSH private key exists and format looks correct"
          else
            echo "ERROR: SERVER_SSH_KEY is not a valid OpenSSH private key"
            exit 1
          fi

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd /root/Dealioo-frontend

            git fetch origin
            git reset --hard origin/main
            
            npm ci
            npm run build

            pm2 restart dealioo-frontend
            pm2 save